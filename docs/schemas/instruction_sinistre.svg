<text x="395.0" y="267.5" text-anchor="middle">Ouvrir ou compléter</text>
<text x="395.0" y="280.5" text-anchor="middle">le dossier</text>
<rect x="490" y="430" width="130" height="80" rx="10" fill="#E3ECF5" stroke="#1F4E79" stroke-width="1.5"/>
<text x="555.0" y="461.0" text-anchor="middle">1-2. Police en</text>
<text x="555.0" y="474.0" text-anchor="middle">vigueur, version</text>
<text x="555.0" y="487.0" text-anchor="middle">applicable (SQL)</text>
<text x="497" y="444" font-size="11">⚙</text>
<rect x="650" y="430" width="130" height="80" rx="10" fill="#E3ECF5" stroke="#1F4E79" stroke-width="1.5"/>
<text x="715.0" y="467.5" text-anchor="middle">3. Garantie souscrite</text>
<text x="715.0" y="480.5" text-anchor="middle">(classifieur + SQL)</text>
<text x="657" y="444" font-size="11">⚙</text>
<rect x="810" y="430" width="130" height="80" rx="10" fill="#E3ECF5" stroke="#1F4E79" stroke-width="1.5"/>
<text x="875.0" y="454.5" text-anchor="middle">4-6. Événement,</text>
<text x="875.0" y="467.5" text-anchor="middle">exclusions,</text>
<text x="875.0" y="480.5" text-anchor="middle">conditions (recherche</text>
<text x="875.0" y="493.5" text-anchor="middle">+ LLM vérifié)</text>
<text x="817" y="444" font-size="11">⚙</text>
<rect x="970" y="430" width="130" height="80" rx="10" fill="#E3ECF5" stroke="#1F4E79" stroke-width="1.5"/>
<text x="1035.0" y="467.5" text-anchor="middle">7. Montant : plafond,</text>
<text x="1035.0" y="480.5" text-anchor="middle">franchise</text>
<text x="977" y="444" font-size="11">⚙</text>
<rect x="1130" y="430" width="130" height="80" rx="10" fill="#E3ECF5" stroke="#1F4E79" stroke-width="1.5"/>
<text x="1195.0" y="467.5" text-anchor="middle">Déduire le verdict</text>
<text x="1195.0" y="480.5" text-anchor="middle">des contrôles</text>
<text x="1137" y="444" font-size="11">▦</text>
<polygon points="1325.0,445 1350,470.0 1325.0,495 1300,470.0" fill="white" stroke="#14213D" stroke-width="1.5"/>
<path d="M1317.0,462.0 L1333.0,478.0 M1333.0,462.0 L1317.0,478.0" stroke="#14213D" stroke-width="3"/>
<text x="1323.0" y="439" text-anchor="end" font-size="10">Verdict ?</text>
<rect x="1420" y="180" width="130" height="55" rx="10" fill="white" stroke="#1F4E79" stroke-width="1.5"/>
<text x="1485.0" y="211.5" text-anchor="middle">Valider et régler</text>
<rect x="1420" y="245" width="130" height="55" rx="10" fill="white" stroke="#1F4E79" stroke-width="1.5"/>
<text x="1485.0" y="270.0" text-anchor="middle">Notifier un refus</text>
<text x="1485.0" y="283.0" text-anchor="middle">motivé</text>
<rect x="1420" y="310" width="130" height="55" rx="10" fill="white" stroke="#1F4E79" stroke-width="1.5"/>
<text x="1485.0" y="328.5" text-anchor="middle">Demander les</text>
<text x="1485.0" y="341.5" text-anchor="middle">informations</text>
<text x="1485.0" y="354.5" text-anchor="middle">manquantes</text>
<rect x="1420" y="45" width="130" height="80" rx="10" fill="white" stroke="#1F4E79" stroke-width="1.5"/>
<text x="1485.0" y="82.5" text-anchor="middle">Fournir les</text>
<text x="1485.0" y="95.5" text-anchor="middle">informations</text>
<circle cx="1618.0" cy="207.0" r="18.0" fill="white" stroke="#14213D" stroke-width="3.5"/>
<text x="1618.0" y="239" text-anchor="middle" font-size="10">Dossier réglé</text>
<circle cx="1618.0" cy="272.0" r="18.0" fill="white" stroke="#14213D" stroke-width="3.5"/>
<text x="1618.0" y="304" text-anchor="middle" font-size="10">Refus notifié</text>
<text x="40" y="602" font-size="10">Tâches bleues : automatiques (outil). Tâches blanches : humaines. Le verdict est déduit des contrôles ; la décision reste au gestionnaire.</text>
